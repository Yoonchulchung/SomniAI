[tool.isort]
profile = "black"          
line_length = 88          
multi_line_output = 3     
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

known_first_party = ["SomniAI"]  
known_third_party = ["fastapi", "torch", "torchvision", "PIL", "numpy", "yaml", "rich", "psutil"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[project]
name = "middleware-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Yoonchul Chung"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.118.0,<0.119.0)",
    "uvicorn[standard] (>=0.37.0,<0.38.0)",
    "hypercorn (>=0.17.3,<0.18.0)",
    "rich (>=14.1.0,<15.0.0)",
    "numpy (<2.3)",
    "pillow (>=11.3.0,<12.0.0)",
    "psutil (>=7.1.0,<8.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)"
]

[tools.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
