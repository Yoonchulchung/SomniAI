#############################################################
# SomniAI Docker Compose File
# Clean Architecture Implementation
# Created By Yoonchul Chung
#############################################################
version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: somniai-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - somniai_network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: somniai-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - somniai_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: somniai-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-pass}
      MYSQL_USER: ${MYSQL_USER:-somniai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-somniai-pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-somniai}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - somniai_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: somniai:2.0
    container_name: somniai-api
    restart: unless-stopped
    environment:
      # Application
      APP_NAME: ${APP_NAME:-SomniAI}
      APP_VERSION: ${APP_VERSION:-2.0.0}
      DEBUG: ${DEBUG:-false}

      # FastAPI
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      WORKERS: ${WORKERS:-1}
      RELOAD: ${RELOAD:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-somniai}
      DB_PASSWORD: ${MYSQL_PASSWORD:-somniai-pass}
      DB_NAME: ${MYSQL_DATABASE:-somniai}
      DB_ECHO: ${DB_ECHO:-false}

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-secure-key-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # MQTT
      MQTT_ADDRESS: ${MQTT_ADDRESS:-localhost}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-somniai/pillow/esp32}

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_AIR: ${KAFKA_TOPIC_AIR:-somniai-air-images}
      KAFKA_TOPIC_SIDE: ${KAFKA_TOPIC_SIDE:-somniai-side-images}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-somniai-consumer-group}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./work_dir:/app/work_dir
      - ./vision_models:/app/vision_models
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - somniai_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  somniai_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
