#############################################################
# SomniAI Docker Compose File
# Clean Architecture Implementation
# Created By Yoonchul Chung
#############################################################
version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: somniai-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-pass}
      MYSQL_USER: ${MYSQL_USER:-somniai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-somniai-pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-somniai}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - somniai_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: somniai:2.0
    container_name: somniai-api
    restart: unless-stopped
    environment:
      # Application
      APP_NAME: ${APP_NAME:-SomniAI}
      APP_VERSION: ${APP_VERSION:-2.0.0}
      DEBUG: ${DEBUG:-false}

      # FastAPI
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      WORKERS: ${WORKERS:-1}
      RELOAD: ${RELOAD:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-somniai}
      DB_PASSWORD: ${MYSQL_PASSWORD:-somniai-pass}
      DB_NAME: ${MYSQL_DATABASE:-somniai}
      DB_ECHO: ${DB_ECHO:-false}

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-secure-key-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # MQTT
      MQTT_ADDRESS: ${MQTT_ADDRESS:-localhost}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-somniai/pillow/esp32}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./work_dir:/app/work_dir
      - ./vision_models:/app/vision_models
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - somniai_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  somniai_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
