name: CI Build and Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and TypeCheck job - runs first and fastest
  lint:
    name: Lint and TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MoJI/package-lock.json

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: MoJI/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('MoJI/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./MoJI
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        working-directory: ./MoJI
        run: npm run lint

      - name: Run Prettier check
        working-directory: ./MoJI
        run: npm run format:check

      - name: Run TypeScript check
        working-directory: ./MoJI
        run: npm run typecheck

  # Android build on Ubuntu
  build-android-ubuntu:
    name: Build Android (Ubuntu)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MoJI/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            MoJI/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: MoJI/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('MoJI/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        working-directory: ./MoJI
        run: npm ci --prefer-offline --no-audit

      - name: Create local.properties
        working-directory: ./MoJI/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Android Debug APK
        working-directory: ./MoJI/android
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-ubuntu
          path: MoJI/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # Android build on macOS
  build-android-macos:
    name: Build Android (macOS)
    runs-on: macos-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MoJI/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            MoJI/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: MoJI/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('MoJI/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        working-directory: ./MoJI
        run: npm ci --prefer-offline --no-audit

      - name: Create local.properties
        working-directory: ./MoJI/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Android Debug APK
        working-directory: ./MoJI/android
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-macos
          path: MoJI/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # Summary job
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-android-ubuntu, build-android-macos]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Ubuntu Build: ${{ needs.build-android-ubuntu.result }}"
          echo "macOS Build: ${{ needs.build-android-macos.result }}"

          if [[ "${{ needs.build-android-ubuntu.result }}" != "success" ]] || [[ "${{ needs.build-android-macos.result }}" != "success" ]]; then
            echo "❌ One or more builds failed"
            exit 1
          else
            echo "✅ All builds passed successfully!"
          fi
