apiVersion: v1
kind: Secret
metadata:
  name: somniai-secrets
  namespace: somniai
type: Opaque
stringData:
  # PostgreSQL Credentials (CHANGE IN PRODUCTION!)
  POSTGRES_USER: "somniai"
  POSTGRES_PASSWORD: "somniai"
  DATABASE_URL: "postgresql://somniai:somniai@postgres-service:5432/somniai"

  # JWT Secret (CHANGE IN PRODUCTION!)
  JWT_SECRET: "somniai-jwt-secret-change-in-production"

  # Redis Password (change in production)
  REDIS_PASSWORD: ""

  # MQTT Credentials (optional, change in production)
  MQTT_USERNAME: ""
  MQTT_PASSWORD: ""
